name: Backend and frontend tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install backend requirements
        run: pip install -r backend/requirements.txt
      - name: Run backend unit tests
        run: python -m unittest discover -s backend/tests -v
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Check frontend JavaScript syntax
        run: node --check app.js && node --check saved-searches.mjs && node --check saved-regions.mjs && node --check regional-summary.mjs && node --check saved-facilities.mjs && node --check data-freshness.mjs && node --check region-selector.mjs
      - name: Run frontend tests
        run: node --test tests/*.test.mjs
